# Deploy to Production Workflow
# Triggered on push to the main branch. Lints, builds, and deploys
# Cloud Functions, Firestore rules/indexes, and Storage rules to japa-platform.

name: Deploy to Production

# Trigger on pushes to the main branch only
on:
  push:
    branches:
      - main

jobs:
  # Lint, build, and deploy Cloud Functions to the production Firebase project
  deploy:
    name: Lint, Build & Deploy to Production
    runs-on: ubuntu-latest

    # Opt into Node.js 24 runtime for GitHub Actions to avoid deprecation warnings
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v6

      # Set up Node.js 22 to match the engine requirement in package.json
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      # Install dependencies from the lockfile for reproducible builds
      - name: Install dependencies
        working-directory: functions
        run: npm ci

      # Run ESLint to catch code style and potential errors
      - name: Lint
        working-directory: functions
        run: npm run lint

      # Compile TypeScript to verify the build succeeds before deploying
      - name: Build
        working-directory: functions
        run: npm run build

      # Authenticate to Google Cloud using the official auth action.
      #
      # Replaces the third-party w9jds/firebase-action. This action parses and
      # validates the service-account JSON, writes it to a temp credentials file,
      # and exports GOOGLE_APPLICATION_CREDENTIALS so downstream Firebase/Google
      # tooling picks up Application Default Credentials automatically — no
      # interactive `firebase login` required.
      #
      # We reuse the existing FIREBASE_SERVICE_ACCOUNT_PROD secret (the full SA
      # key JSON). To go keyless later, drop `credentials_json` and instead set
      # `workload_identity_provider` + `service_account`, and add
      # `permissions: { id-token: write }` to this job.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}

      # Deploy functions, Firestore rules/indexes, and Storage rules to japa-platform.
      #
      # Runs from the repo root (where firebase.json lives). firebase-tools reads
      # the credentials exported by the auth step above. The version is pinned
      # (not @latest / @master) so CI is reproducible and can't silently break
      # when a new firebase-tools release is published — which is exactly how the
      # previous w9jds@master setup regressed.
      - name: Deploy to Firebase (prod)
        run: npx --yes firebase-tools@15.22.0 deploy --project default --force
