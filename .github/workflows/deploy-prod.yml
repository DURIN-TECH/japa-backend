# Deploy to Production Workflow
# Triggered on push to the main branch. Lints, builds, and deploys
# Cloud Functions, Firestore rules/indexes, and Storage rules to japa-platform.

name: Deploy to Production

# Trigger on pushes to the main branch only
on:
  push:
    branches:
      - main

jobs:
  # Lint, build, and deploy Cloud Functions to the production Firebase project
  deploy:
    name: Lint, Build & Deploy to Production
    runs-on: ubuntu-latest

    # Opt into Node.js 24 runtime for GitHub Actions to avoid deprecation warnings
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v6

      # Set up Node.js 22 to match the engine requirement in package.json
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      # Install dependencies from the lockfile for reproducible builds
      - name: Install dependencies
        working-directory: functions
        run: npm ci

      # Run ESLint to catch code style and potential errors
      - name: Lint
        working-directory: functions
        run: npm run lint

      # Compile TypeScript to verify the build succeeds before deploying
      - name: Build
        working-directory: functions
        run: npm run build

      # Deploy functions, Firestore rules/indexes, and Storage rules to
      # japa-platform. Runs from the repo root (where firebase.json lives). The
      # firebase-tools version is pinned (not @latest / @master) so CI is
      # reproducible.
      #
      # Auth: write the FIREBASE_SERVICE_ACCOUNT_PROD key to a temp file and point
      # ADC at it via GOOGLE_APPLICATION_CREDENTIALS — firebase-tools authenticates
      # from that directly. (google-github-actions/auth's credential file was NOT
      # consumed by firebase-tools — "Failed to authenticate" — so we write the raw
      # key ourselves. It lives only in the ephemeral runner temp dir and secrets
      # are masked in logs. Matches deploy-dev.yml.)
      - name: Deploy to Firebase (prod)
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROD }}
        run: |
          printf '%s' "$FIREBASE_SA_KEY" > "$RUNNER_TEMP/sa-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa-key.json"
          npx --yes firebase-tools@15.22.0 deploy --project default --force
