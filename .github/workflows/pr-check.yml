# PR Check Workflow
# Runs lint, build and unit-test checks on pull requests targeting main or dev branches.
# This ensures code quality before merging — no deployment happens here.

name: PR Check

# Trigger on pull requests to main or dev
on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  # Lint and build the Cloud Functions to validate the PR
  check:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    # Opt into Node.js 24 runtime for GitHub Actions to avoid deprecation warnings
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v6

      # Set up Node.js 22 to match the engine requirement in package.json
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      # Install dependencies from the lockfile for reproducible builds
      - name: Install dependencies
        working-directory: functions
        run: npm ci

      # Run ESLint to catch code style and potential errors (src/, test/; the eval lives in src/scrapers/visa-catalog/eval/)
      - name: Lint
        working-directory: functions
        run: npm run lint

      # Compile TypeScript to verify the build succeeds
      - name: Build
        working-directory: functions
        run: npm run build

      # Run the unit tests (node:test via tsx, see functions/test/).
      # They are pure and hermetic: no secrets, .env files, emulators or
      # network are needed, so no env/secrets are passed to this step.
      # Any failing test exits non-zero and fails the PR check.
      - name: Test
        working-directory: functions
        run: npm test

  # Run the Firebase-emulator suites: the Firestore and Storage rules tests
  # against the repo's real rules files, and the end-to-end API tests against
  # the real Express app with real ID tokens (functions/test/emulator/).
  # The demo project id and the non-default test ports live in
  # firebase.emulator-test.json; no secrets or .env files are needed.
  emulator:
    name: Emulator tests
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      # The Firestore / Auth / Storage emulators are Java processes.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      # `npm run test:emulator` shells out to the Firebase CLI
      # (`firebase emulators:exec`), which is not a dependency of the repo.
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15

      - name: Emulator tests
        working-directory: functions
        run: npm run test:emulator
