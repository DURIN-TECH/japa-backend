# Deploy to Dev Workflow
# Triggered on push to the `dev` branch. Lints, builds, and deploys Cloud
# Functions, Firestore rules/indexes, and Storage rules to the durin-seli-dev
# ("Seli Dev") project.
#
# Auth: the ci-deployer service-account key (created by Terraform) is stored as
# the FIREBASE_SERVICE_ACCOUNT_DEV repo secret; the deploy step writes it to a
# temp file and points GOOGLE_APPLICATION_CREDENTIALS at it. (Keyless WIF and
# google-github-actions/auth's credential file both failed with "Failed to
# authenticate" from firebase-tools; a raw key via ADC works. WIF pool/SA still
# exist in Terraform if we revisit.)

name: Deploy to Dev

# Trigger on pushes to the dev branch, or manually (to re-deploy + re-seed dev
# on demand without pushing a commit).
on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    name: Lint, Build & Deploy to Dev
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v6

      # Set up Node.js 22 to match the engine requirement in package.json
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      # Install dependencies from the lockfile for reproducible builds
      - name: Install dependencies
        working-directory: functions
        run: npm ci

      # Run ESLint to catch code style and potential errors
      - name: Lint
        working-directory: functions
        run: npm run lint

      # Compile TypeScript to verify the build succeeds before deploying
      - name: Build
        working-directory: functions
        run: npm run build

      # Deploy functions, Firestore rules/indexes, and Storage rules to the dev
      # project. `--project dev` resolves to durin-seli-dev via .firebaserc.
      #
      # Auth: write the ci-deployer SA key to a temp file and point ADC at it via
      # GOOGLE_APPLICATION_CREDENTIALS. firebase-tools authenticates from that
      # directly. (This is reliable where google-github-actions/auth's credential
      # file was NOT consumed by firebase-tools — "Failed to authenticate". The
      # key lives only in the ephemeral runner temp dir and is masked in logs.)
      # NOTE: the Storage default bucket must exist first (provisioned once) or
      # the storage-rules stage of the deploy will fail.
      - name: Deploy to Firebase (dev)
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        run: |
          printf '%s' "$FIREBASE_SA_KEY" > "$RUNNER_TEMP/sa-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa-key.json"
          npx --yes firebase-tools@15.22.0 deploy --project dev --force

      # Seed the dev project with the baseline test dataset (auth users,
      # agencies, agents, clients, countries/visas, applications, plans,
      # subscriptions, document templates, RBAC claims) so dev is always ready
      # for testing with no manual step.
      #
      # SAFE TO RUN EVERY DEPLOY — the consolidated seeder (scripts/seed-all.ts)
      # is idempotent: it uses deterministic auth/document IDs, skips auth users
      # that already exist, and upserts Firestore docs with set()/merge. So a
      # re-run refreshes the seed baseline (and role claims) without duplicating
      # data or erroring, and it never deletes anything — data you created while
      # testing (which has random IDs) is left untouched.
      #
      # Auth: reuses the same ci-deployer SA key as the deploy step. seed:dev
      # targets durin-seli-dev explicitly (`--project durin-seli-dev`), so it can
      # never touch prod, and prod's seed guard stays intact regardless.
      - name: Seed dev data (idempotent)
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
        working-directory: functions
        run: |
          printf '%s' "$FIREBASE_SA_KEY" > "$RUNNER_TEMP/sa-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa-key.json"
          npm run seed:dev
