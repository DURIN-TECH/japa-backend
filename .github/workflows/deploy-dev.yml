# Deploy to Dev Workflow
# Triggered on push to the `dev` branch. Lints, builds, and deploys Cloud
# Functions, Firestore rules/indexes, and Storage rules to the durin-seli-dev
# ("Seli Dev") project.
#
# Auth uses a key for the ci-deployer service account (created by Terraform),
# stored as the FIREBASE_SERVICE_ACCOUNT_DEV repo secret — same mechanism as the
# prod workflow. (Keyless WIF was tried but firebase-tools doesn't consume the
# external-account credential; the WIF pool/SA still exist in Terraform.)

name: Deploy to Dev

# Trigger on pushes to the dev branch only
on:
  push:
    branches:
      - dev

jobs:
  deploy:
    name: Lint, Build & Deploy to Dev
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v6

      # Set up Node.js 22 to match the engine requirement in package.json
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: functions/package-lock.json

      # Install dependencies from the lockfile for reproducible builds
      - name: Install dependencies
        working-directory: functions
        run: npm ci

      # Run ESLint to catch code style and potential errors
      - name: Lint
        working-directory: functions
        run: npm run lint

      # Compile TypeScript to verify the build succeeds before deploying
      - name: Build
        working-directory: functions
        run: npm run build

      # Authenticate with the ci-deployer service-account key (same mechanism as
      # the prod workflow). firebase-tools reads the credentials file this action
      # writes via GOOGLE_APPLICATION_CREDENTIALS. NOTE: WIF/keyless was tried
      # first but firebase-tools does not consume the external-account credential
      # ("Failed to authenticate"), so we use a SA key like prod. The keyless WIF
      # pool/SA still exist in Terraform if we revisit this later.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}

      # Deploy functions, Firestore rules/indexes, and Storage rules to the dev
      # project. `--project dev` resolves to durin-seli-dev via .firebaserc.
      # NOTE: the Storage default bucket must exist first (provision it once in
      # the Firebase console) or the storage-rules step of the deploy will fail.
      - name: Deploy to Firebase (dev)
        run: npx --yes firebase-tools@15.22.0 deploy --project dev --force
